<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="48%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fdfbf7"/>
      <stop offset="85%" stop-color="#f8f2e6"/>
      <stop offset="100%" stop-color="#efe5d0"/>
    </radialGradient>

    <!-- Golden Auras -->
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6e2a8" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#eed186" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#dfb86c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#dfb86c" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Foil Gradients -->
    <linearGradient id="goldLeaf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c97e"/>
      <stop offset="35%" stop-color="#ffd984"/>
      <stop offset="70%" stop-color="#c89d49"/>
      <stop offset="100%" stop-color="#a67b28"/>
    </linearGradient>

    <linearGradient id="goldLeaf2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd984"/>
      <stop offset="50%" stop-color="#d4aa54"/>
      <stop offset="100%" stop-color="#9a6f23"/>
    </linearGradient>

    <!-- Dove Body Gradients -->
    <linearGradient id="doveBody" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#fcfbfa"/>
      <stop offset="100%" stop-color="#eedfd5"/>
    </linearGradient>

    <linearGradient id="doveWingBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f4ece5"/>
      <stop offset="100%" stop-color="#dfd0c4"/>
    </linearGradient>

    <linearGradient id="doveWingFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#faf5f0"/>
      <stop offset="100%" stop-color="#e4d7cc"/>
    </linearGradient>

    <!-- Watercolor Rose Petal Gradients -->
    <radialGradient id="rosePink" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fff0f3"/>
      <stop offset="45%" stop-color="#fbc5d2"/>
      <stop offset="85%" stop-color="#ea93a7"/>
      <stop offset="100%" stop-color="#d66e85"/>
    </radialGradient>

    <radialGradient id="roseBlush" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fce1e7"/>
      <stop offset="85%" stop-color="#f4aab8"/>
      <stop offset="100%" stop-color="#e08496"/>
    </radialGradient>

    <!-- Leaf Gradients -->
    <linearGradient id="sageLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b0c4a4"/>
      <stop offset="60%" stop-color="#8ba482"/>
      <stop offset="100%" stop-color="#677f5e"/>
    </linearGradient>

    <linearGradient id="oliveLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5d4b8"/>
      <stop offset="50%" stop-color="#9fb392"/>
      <stop offset="100%" stop-color="#738965"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8a6d45" flood-opacity="0.18"/>
    </filter>
    <filter id="doveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Base Disc -->
  <circle cx="512" cy="512" r="500" fill="url(#bgGrad)"/>

  <!-- Subtle Sacred Halo Rays -->
  <g opacity="0.38">
    <circle cx="512" cy="512" r="380" fill="url(#haloGrad)"/>
    <!-- 16 delicate radial beams -->
    <g stroke="url(#goldLeaf1)" stroke-width="1.2" stroke-linecap="round" opacity="0.5">
      <line x1="512" y1="190" x2="512" y2="250"/>
      <line x1="512" y1="834" x2="512" y2="774"/>
      <line x1="190" y1="512" x2="250" y2="512"/>
      <line x1="834" y1="512" x2="774" y2="512"/>
      <line x1="284" y1="284" x2="330" y2="330"/>
      <line x1="740" y1="740" x2="694" y2="694"/>
      <line x1="284" y1="740" x2="330" y2="694"/>
      <line x1="740" y1="284" x2="694" y2="330"/>
      <line x1="225" y1="395" x2="275" y2="415"/>
      <line x1="799" y1="629" x2="749" y2="609"/>
      <line x1="225" y1="629" x2="275" y2="609"/>
      <line x1="799" y1="395" x2="749" y2="415"/>
      <line x1="395" y1="225" x2="415" y2="275"/>
      <line x1="629" y1="799" x2="609" y2="749"/>
      <line x1="395" y1="799" x2="415" y2="749"/>
      <line x1="629" y1="225" x2="609" y2="275"/>
    </g>
  </g>

  <!-- Dual Filigree Circular Frames -->
  <circle cx="512" cy="512" r="460" fill="none" stroke="url(#goldLeaf1)" stroke-width="2.2" opacity="0.6"/>
  <circle cx="512" cy="512" r="450" fill="none" stroke="url(#goldLeaf2)" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.5"/>
  <circle cx="512" cy="512" r="410" fill="none" stroke="url(#goldLeaf1)" stroke-width="1.8" opacity="0.4"/>

  <!-- Botanical Wreath Surrounding the Dove (Blush Roses & Sage Eucalyptus) -->
  <g id="wreath" filter="url(#softShadow)">
    <!-- Main curving vine branches -->
    <path d="M 210,512 C 205,330 330,205 512,205 C 694,205 819,330 814,512 C 819,694 694,819 512,819 C 330,819 205,694 210,512"
          fill="none" stroke="url(#goldLeaf1)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

    <!-- Left & Upper Left Leaves -->
    <path d="M 205,440 C 165,420 160,370 200,380 C 220,385 225,415 205,440 Z" fill="url(#sageLeaf)"/>
    <path d="M 205,440 C 185,400 195,385 200,380" fill="none" stroke="url(#goldLeaf2)" stroke-width="1"/>

    <path d="M 245,350 C 215,315 225,270 260,290 C 278,300 270,335 245,350 Z" fill="url(#oliveLeaf)"/>
    <path d="M 245,350 C 240,315 250,298 260,290" fill="none" stroke="url(#goldLeaf2)" stroke-width="1"/>

    <path d="M 315,265 C 290,225 320,185 350,215 C 365,230 350,255 315,265 Z" fill="url(#sageLeaf)"/>
    <path d="M 405,215 C 400,165 445,150 460,190 C 468,210 440,225 405,215 Z" fill="url(#oliveLeaf)"/>

    <!-- Top & Upper Right Leaves -->
    <path d="M 520,205 C 535,160 580,165 580,205 C 580,225 550,230 520,205 Z" fill="url(#sageLeaf)"/>
    <path d="M 625,225 C 660,185 705,205 690,245 C 680,265 650,255 625,225 Z" fill="url(#oliveLeaf)"/>
    <path d="M 720,285 C 765,265 795,305 765,340 C 745,355 725,325 720,285 Z" fill="url(#sageLeaf)"/>
    <path d="M 790,375 C 840,370 850,420 810,435 C 790,442 778,410 790,375 Z" fill="url(#oliveLeaf)"/>

    <!-- Right & Lower Right Leaves -->
    <path d="M 814,480 C 865,495 855,545 815,550 C 795,552 790,515 814,480 Z" fill="url(#sageLeaf)"/>
    <path d="M 795,585 C 835,615 810,665 775,655 C 755,650 765,615 795,585 Z" fill="url(#oliveLeaf)"/>
    <path d="M 740,680 C 765,725 725,765 690,740 C 672,727 695,695 740,680 Z" fill="url(#sageLeaf)"/>
    <path d="M 645,760 C 655,810 610,835 585,800 C 570,780 605,760 645,760 Z" fill="url(#oliveLeaf)"/>

    <!-- Bottom & Lower Left Leaves -->
    <path d="M 512,819 C 495,865 450,855 455,815 C 458,795 488,795 512,819 Z" fill="url(#sageLeaf)"/>
    <path d="M 400,795 C 365,835 320,810 335,775 C 345,755 378,765 400,795 Z" fill="url(#oliveLeaf)"/>
    <path d="M 295,735 C 255,755 230,715 255,680 C 270,660 295,690 295,735 Z" fill="url(#sageLeaf)"/>
    <path d="M 225,640 C 180,635 180,585 220,580 C 240,578 245,610 225,640 Z" fill="url(#oliveLeaf)"/>
    <path d="M 205,550 C 160,535 170,485 210,490 C 230,492 230,528 205,550 Z" fill="url(#sageLeaf)"/>

    <!-- Golden Olives / Berries along the wreath -->
    <g fill="url(#goldLeaf1)">
      <circle cx="215" cy="360" r="9"/>
      <circle cx="230" cy="345" r="7"/>
      <circle cx="340" cy="240" r="9"/>
      <circle cx="605" cy="205" r="9"/>
      <circle cx="620" cy="190" r="7"/>
      <circle cx="780" cy="320" r="9"/>
      <circle cx="830" cy="460" r="9"/>
      <circle cx="770" cy="625" r="9"/>
      <circle cx="785" cy="640" r="7"/>
      <circle cx="615" cy="780" r="9"/>
      <circle cx="365" cy="790" r="9"/>
      <circle cx="350" cy="805" r="7"/>
      <circle cx="235" cy="670" r="9"/>
    </g>

    <!-- Watercolor Roses Clusters -->
    <!-- Top-Left Rose Cluster -->
    <g transform="translate(265, 305)">
      <circle cx="0" cy="0" r="28" fill="url(#roseBlush)" opacity="0.95"/>
      <path d="M -12,-8 C -5,-22 15,-20 18,-6 C 20,8 6,18 -8,14 C -18,10 -16,-2 -12,-8 Z" fill="url(#rosePink)"/>
      <path d="M -6,-4 C 0,-12 10,-10 10,-2 C 10,6 0,8 -6,4 Z" fill="#ffffff" opacity="0.6"/>
      <circle cx="0" cy="0" r="5" fill="#e2738b"/>
    </g>

    <!-- Top Rosebud -->
    <g transform="translate(470, 195)">
      <circle cx="0" cy="0" r="22" fill="url(#roseBlush)"/>
      <path d="M -8,-6 C -2,-16 12,-14 12,-4 C 12,6 2,12 -8,8 Z" fill="url(#rosePink)"/>
      <circle cx="0" cy="0" r="4" fill="#e2738b"/>
    </g>

    <!-- Top-Right Rose Cluster -->
    <g transform="translate(725, 260)">
      <circle cx="0" cy="0" r="30" fill="url(#roseBlush)" opacity="0.95"/>
      <path d="M -14,-10 C -6,-24 16,-22 20,-8 C 22,6 8,20 -10,16 C -20,12 -18,-4 -14,-10 Z" fill="url(#rosePink)"/>
      <path d="M -6,-4 C 0,-12 10,-10 10,-2 C 10,6 0,8 -6,4 Z" fill="#ffffff" opacity="0.65"/>
      <circle cx="0" cy="0" r="6" fill="#e2738b"/>
    </g>

    <!-- Bottom-Right Rose Cluster -->
    <g transform="translate(715, 710)">
      <circle cx="0" cy="0" r="32" fill="url(#roseBlush)" opacity="0.95"/>
      <path d="M -15,-10 C -8,-25 18,-24 22,-9 C 24,7 10,22 -10,18 C -22,14 -20,-3 -15,-10 Z" fill="url(#rosePink)"/>
      <circle cx="0" cy="0" r="6" fill="#e2738b"/>
    </g>

    <!-- Bottom Rose Cluster -->
    <g transform="translate(460, 815)">
      <circle cx="0" cy="0" r="26" fill="url(#roseBlush)"/>
      <path d="M -10,-8 C -4,-18 14,-16 16,-5 C 18,6 6,14 -8,11 Z" fill="url(#rosePink)"/>
      <circle cx="0" cy="0" r="5" fill="#e2738b"/>
    </g>

    <!-- Bottom-Left Rose Cluster -->
    <g transform="translate(255, 680)">
      <circle cx="0" cy="0" r="30" fill="url(#roseBlush)" opacity="0.95"/>
      <path d="M -14,-10 C -6,-24 16,-22 20,-8 C 22,6 8,20 -10,16 C -20,12 -18,-4 -14,-10 Z" fill="url(#rosePink)"/>
      <circle cx="0" cy="0" r="6" fill="#e2738b"/>
    </g>
  </g>

  <!-- Sacred Radiant Glow Centered behind the Dove -->
  <circle cx="512" cy="495" r="160" fill="url(#haloGrad)" opacity="0.9"/>

  <!-- Golden Olive Branch in Dove's Beak -->
  <g id="oliveBranch" filter="url(#softShadow)">
    <path d="M 590,445 C 630,425 665,395 705,385 C 725,380 740,385 750,380"
          fill="none" stroke="url(#goldLeaf1)" stroke-width="3" stroke-linecap="round"/>
    <!-- Branch Leaves -->
    <path d="M 640,420 C 655,395 685,400 680,425 C 670,435 650,430 640,420 Z" fill="url(#oliveLeaf)"/>
    <path d="M 670,405 C 690,380 720,385 715,410 C 705,420 685,415 670,405 Z" fill="url(#sageLeaf)"/>
    <path d="M 705,388 C 730,365 760,370 755,395 C 745,405 725,400 705,388 Z" fill="url(#oliveLeaf)"/>
    <path d="M 660,425 C 670,450 698,445 695,425 C 688,415 670,418 660,425 Z" fill="url(#sageLeaf)"/>
    <path d="M 695,410 C 710,435 738,430 735,410 C 728,400 708,402 695,410 Z" fill="url(#oliveLeaf)"/>
    <!-- Golden Olives on Branch -->
    <circle cx="665" cy="432" r="6.5" fill="url(#goldLeaf2)"/>
    <circle cx="715" cy="415" r="6.5" fill="url(#goldLeaf2)"/>
  </g>

  <!-- THE SACRED DOVE (White Dove of the Holy Spirit / Baptism) -->
  <g id="baptismDove" filter="url(#softShadow)">
    <!-- Back Wing (Layer 1 - Outstretched upwards & backwards) -->
    <g id="wingBack">
      <!-- Wing base feathers -->
      <path d="M 450,470 C 420,400 395,310 435,245 C 445,230 460,230 465,245 C 475,270 480,310 495,370 C 510,425 500,475 450,470 Z"
            fill="url(#doveWingBack)"/>
      <path d="M 465,245 C 480,270 485,310 500,365" fill="none" stroke="#d5c4b5" stroke-width="1.2" opacity="0.6"/>

      <!-- Additional back feathers -->
      <path d="M 435,245 C 410,265 400,320 420,380 C 440,435 460,465 450,470 C 430,420 425,360 435,245 Z"
            fill="#ede3d8" opacity="0.8"/>
      <path d="M 410,295 C 385,335 385,385 410,440" fill="none" stroke="#d5c4b5" stroke-width="1.2" opacity="0.5"/>
    </g>

    <!-- Fan Tail Feathers (Spread gracefully downwards-left) -->
    <g id="tailFeathers">
      <path d="M 390,545 C 320,575 250,595 240,620 C 235,632 245,638 260,632 C 295,618 355,590 405,565 Z"
            fill="url(#doveWingBack)"/>
      <path d="M 395,548 C 340,595 285,635 280,655 C 278,665 290,668 305,660 C 345,640 390,605 418,575 Z"
            fill="url(#doveWingFront)"/>
      <path d="M 405,555 C 370,620 330,670 330,690 C 330,700 345,700 360,688 C 395,660 425,620 435,585 Z"
            fill="#f9f5f0"/>
      <!-- Tail feather rib accents -->
      <path d="M 400,555 C 320,605 270,630 255,630" fill="none" stroke="#d8c8ba" stroke-width="1.2" opacity="0.55"/>
      <path d="M 408,565 C 355,620 315,655 300,660" fill="none" stroke="#d8c8ba" stroke-width="1.2" opacity="0.55"/>
      <path d="M 420,575 C 385,640 355,675 350,685" fill="none" stroke="#d8c8ba" stroke-width="1.2" opacity="0.55"/>
    </g>

    <!-- Dove Body & Head (Plump, serene, graceful) -->
    <g id="doveBody">
      <!-- Body silhouette -->
      <path d="M 400,550 C 390,520 405,480 440,465 C 470,450 515,445 545,430 C 565,420 580,405 600,418 C 612,425 615,440 600,455 C 575,478 555,490 535,518 C 505,560 455,585 415,570 C 405,565 402,558 400,550 Z"
            fill="url(#doveBody)"/>

      <!-- Breast curve soft shadow & highlight -->
      <path d="M 545,430 C 565,420 580,405 600,418 C 612,425 615,440 600,455 C 565,485 530,525 480,555 C 520,515 550,475 545,430 Z"
            fill="#ffffff" opacity="0.9"/>
      <path d="M 415,570 C 455,585 505,560 535,518 C 510,545 465,565 425,560 Z"
            fill="#dfcfc2" opacity="0.45"/>

      <!-- Golden Beak -->
      <path d="M 605,430 L 632,437 L 606,444 Z" fill="url(#goldLeaf1)"/>
      <path d="M 605,437 L 632,437" stroke="#9e7225" stroke-width="0.8"/>

      <!-- Serene Eye (Soft dark amber with gentle glint) -->
      <circle cx="585" cy="428" r="4.5" fill="#3a2a1a"/>
      <circle cx="586" cy="426.5" r="1.5" fill="#ffffff"/>
    </g>

    <!-- Fore Wing (Layer 3 - Sweeping high into the light) -->
    <g id="wingFront">
      <!-- Main primary feathers sweep -->
      <path d="M 470,475 C 455,420 450,330 500,225 C 512,200 528,202 532,222 C 540,260 540,320 535,395 C 530,445 500,490 470,475 Z"
            fill="url(#doveWingFront)"/>

      <!-- Secondary layered flight feathers -->
      <path d="M 485,465 C 480,400 485,320 525,235 C 535,215 548,220 550,238 C 555,280 550,345 540,415 C 530,460 505,480 485,465 Z"
            fill="#ffffff"/>

      <path d="M 500,455 C 505,390 515,325 548,255 C 556,238 568,245 568,262 C 568,305 560,365 545,430 C 535,465 515,475 500,455 Z"
            fill="url(#doveWingFront)"/>

      <path d="M 515,445 C 525,385 540,325 568,275 C 576,260 588,268 586,285 C 580,328 568,380 550,440 Z"
            fill="#ffffff"/>

      <!-- Delicate feather vane lines -->
      <path d="M 502,230 C 515,310 518,390 485,470" fill="none" stroke="#d5c4b5" stroke-width="1.3" opacity="0.65"/>
      <path d="M 525,238 C 535,315 532,395 502,465" fill="none" stroke="#d5c4b5" stroke-width="1.3" opacity="0.65"/>
      <path d="M 548,258 C 552,325 545,395 520,455" fill="none" stroke="#d5c4b5" stroke-width="1.3" opacity="0.65"/>
      <path d="M 568,280 C 568,340 558,405 535,450" fill="none" stroke="#d5c4b5" stroke-width="1.3" opacity="0.65"/>

      <!-- Covert feathers soft scallop edge at wing base -->
      <path d="M 465,470 C 475,445 495,445 505,465 C 515,445 530,445 540,465"
            fill="none" stroke="#dfd2c5" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>

  <!-- Golden Stars & Holy Light Glimmers -->
  <g fill="url(#goldLeaf1)" opacity="0.75">
    <!-- Star 1 Top Right -->
    <path d="M 640,340 Q 640,355 648,355 Q 640,355 640,370 Q 640,355 632,355 Q 640,355 640,340 Z"/>
    <!-- Star 2 Center Above Dove -->
    <path d="M 512,165 Q 512,176 518,176 Q 512,176 512,187 Q 512,176 506,176 Q 512,176 512,165 Z"/>
    <!-- Star 3 Left -->
    <path d="M 370,360 Q 370,372 377,372 Q 370,372 370,384 Q 370,372 363,372 Q 370,372 370,360 Z"/>
    <!-- Star 4 Lower Right -->
    <path d="M 640,640 Q 640,650 646,650 Q 640,650 640,660 Q 640,650 634,650 Q 640,650 640,640 Z"/>
    <!-- Star 5 Bottom Center -->
    <path d="M 512,850 Q 512,860 517,860 Q 512,860 512,870 Q 512,860 507,860 Q 512,860 512,850 Z"/>
  </g>
</svg>
